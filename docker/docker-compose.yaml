# JADX-AI-MCP Multi-Instance Docker Compose
#
# 这个配置包含:
# - 1 个 MCP 服务器 (端口 8651)
# - 3 个 JADX 实例 (端口 6080-6082 用于 noVNC，8650-8652 用于 API)
#
# 快速启动:
#   docker compose up -d
#
# 默认 APK 挂载:
#   - 所有实例默认挂载项目根目录的 ../temp 到 /apks
#   - 可通过 JADX1_APK_DIR / JADX2_APK_DIR / JADX3_APK_DIR 分别覆盖
#
# 访问:
#   - MCP Server: http://localhost:8651/mcp (连接 LLM)
#   - JADX #1: http://localhost:6080 (noVNC)
#   - JADX #2: http://localhost:6081 (noVNC)
#   - JADX #3: http://localhost:6082 (noVNC)
#
# 加载 APK:
#   1. 将 target.apk 放入 ../temp/ 目录以自动加载
#   2. 或者将应用文件放入你自定义的 APK 挂载目录
#   2. 访问对应的 noVNC 页面
#   3. 在 JADX GUI 中打开 /apks/your-app.apk

services:
  # ============================================
  # MCP Server - 核心服务
  # ============================================
  mcp-server:
    image: xjoker/jadx-mcp-server:latest
    container_name: jadx-mcp-server
    command: [ "uv", "run", "jadx_mcp_server", "--http", "--host", "0.0.0.0", "--config", "/app/data/config/jadx-config.toml" ]
    ports:
      - "8651:8651"
    volumes:
      - ./config:/app/data/config:ro
    environment:
      - TZ=${TZ:-UTC}
    depends_on:
      - jadx-1
      - jadx-2
      - jadx-3
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8651/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jadx-network

  # ============================================
  # JADX Instance #1
  # ============================================
  jadx-1:
    image: xjoker/jadx-ai-mcp:latest
    container_name: jadx-instance-1
    ports:
      - "6080:6080" # noVNC Web Desktop
      - "8650:8650" # Plugin API
    volumes:
      - ${JADX1_APK_DIR:-../temp}:/apks:ro
      - jadx-1-cache:/home/jadx/.cache
      - jadx-1-gui:/home/jadx/.jadx-gui
    environment:
      - TZ=${TZ:-UTC}
      - JADX_PLUGIN_PORT=8650
      - JADX_MCP_BIND_ADDRESS=0.0.0.0
      - JADX_MCP_AUTH_TOKEN=jadx-plugin-secret-token
      - JADX_MCP_AUTH_ENABLED=true
    restart: unless-stopped
    networks:
      - jadx-network

  # ============================================
  # JADX Instance #2
  # ============================================
  jadx-2:
    image: xjoker/jadx-ai-mcp:latest
    container_name: jadx-instance-2
    ports:
      - "6081:6080" # noVNC Web Desktop
      - "8660:8650" # Plugin API (mapped to 8660 on host)
    volumes:
      - ${JADX2_APK_DIR:-../temp}:/apks:ro
      - jadx-2-cache:/home/jadx/.cache
      - jadx-2-gui:/home/jadx/.jadx-gui
    environment:
      - TZ=${TZ:-UTC}
      - JADX_PLUGIN_PORT=8650
      - JADX_MCP_BIND_ADDRESS=0.0.0.0
      - JADX_MCP_AUTH_TOKEN=jadx-plugin-secret-token
      - JADX_MCP_AUTH_ENABLED=true
    restart: unless-stopped
    networks:
      - jadx-network

  # ============================================
  # JADX Instance #3
  # ============================================
  jadx-3:
    image: xjoker/jadx-ai-mcp:latest
    container_name: jadx-instance-3
    ports:
      - "6082:6080" # noVNC Web Desktop
      - "8670:8650" # Plugin API (mapped to 8670 on host)
    volumes:
      - ${JADX3_APK_DIR:-../temp}:/apks:ro
      - jadx-3-cache:/home/jadx/.cache
      - jadx-3-gui:/home/jadx/.jadx-gui
    environment:
      - TZ=${TZ:-UTC}
      - JADX_PLUGIN_PORT=8650
      - JADX_MCP_BIND_ADDRESS=0.0.0.0
      - JADX_MCP_AUTH_TOKEN=jadx-plugin-secret-token
      - JADX_MCP_AUTH_ENABLED=true
    restart: unless-stopped
    networks:
      - jadx-network

# ============================================
# Networks
# ============================================
networks:
  jadx-network:
    driver: bridge

# ============================================
# Volumes (持久化缓存，加速后续分析)
# ============================================
volumes:
  jadx-1-cache:
  jadx-1-gui:
  jadx-2-cache:
  jadx-2-gui:
  jadx-3-cache:
  jadx-3-gui:

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24
autorestart=true
priority=100
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=200
startsecs=3
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -nopw
autorestart=true
priority=300
startsecs=5
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=400
startsecs=5
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:jadx-gui]
command=/opt/jadx/bin/jadx-gui-wrapper.sh
environment=DISPLAY=":99"
autorestart=true
priority=500
startsecs=10
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:mcp-server]
command=/usr/local/bin/uv run --directory /opt/jadx/jadx-mcp-server jadx_mcp_server --http --host 0.0.0.0 --port 8651 --jadx-host 127.0.0.1 --jadx-port %(ENV_JADX_API_PORT)s --config /opt/jadx/jadx-mcp-server/data/config/jadx-config.toml
environment=PYTHONUNBUFFERED="1"
autorestart=true
priority=600
startsecs=15
; MCP Server logs to stdout/stderr for docker logs visibility
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

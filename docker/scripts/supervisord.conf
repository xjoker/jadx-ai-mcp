[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24
autorestart=true
priority=100
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb_err.log

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=200
startsecs=3
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox_err.log

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -nopw
autorestart=true
priority=300
startsecs=5
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc_err.log

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=400
startsecs=5
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc_err.log

[program:jadx-gui]
command=/opt/jadx/bin/jadx-gui-wrapper.sh
environment=DISPLAY=":99"
autorestart=true
priority=500
startsecs=10
stdout_logfile=/var/log/supervisor/jadx.log
stderr_logfile=/var/log/supervisor/jadx_err.log

[program:mcp-server]
command=/usr/local/bin/uv run --directory /opt/jadx/jadx-mcp-server jadx_mcp_server --http --host 0.0.0.0 --port 8651 --jadx-host 127.0.0.1 --jadx-port %(ENV_JADX_API_PORT)s
environment=PYTHONUNBUFFERED="1"
autorestart=true
priority=600
startsecs=15
stdout_logfile=/var/log/supervisor/mcp-server.log
stderr_logfile=/var/log/supervisor/mcp-server_err.log


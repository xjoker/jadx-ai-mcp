# JADX MCP Server 配置文件
# 此文件预配置连接 3 个 JADX 实例

[server]
host = "0.0.0.0"
port = 8651

[defaults]
request_timeout = 120
busy_timeout = 300
health_check_interval = 30

# ============================================
# JADX 实例配置
# 纯 pull 模式下必须显式配置实例，否则 MCP Server 不会自动发现容器
# 这里使用 Docker Compose 内部网络名称预注册 3 个实例
# ============================================

[[jadx_instances]]
name = "jadx-1"
host = "jadx-1"
port = 8650
enabled = true

[[jadx_instances]]
name = "jadx-2"
host = "jadx-2"
port = 8650
enabled = true

[[jadx_instances]]
name = "jadx-3"
host = "jadx-3"
port = 8650
enabled = true

# ============================================
# 用户认证 (可选)
# 取消注释并修改 token 以启用认证
# ============================================

# [[users]]
# name = "alice"
# token = "your-secret-token-here"

[[users]]
name = "admin"
token = "admin-secret-token"
is_admin = true

# JADX MCP Server 配置文件
# Docker Compose 多实例部署配置 - 连接 3 个独立 JADX 容器
#
# 认证说明:
#   容器自带默认 admin 用户，token 为 "admin-secret-token"。
#   请在生产环境中修改为强随机 token。

[server]
host = "0.0.0.0"
port = 8651

[defaults]
request_timeout = 120
busy_timeout = 300
health_check_interval = 30
# JADX 插件认证 Token（与各 JADX 实例的 JADX_MCP_AUTH_TOKEN 环境变量一致）
jadx_token = "jadx-plugin-secret-token"

# ============================================
# JADX 实例配置
# Docker Compose 内部网络名称预注册 3 个实例
# ============================================

[[jadx_instances]]
name = "jadx-1"
host = "jadx-1"
port = 8650
enabled = true

[[jadx_instances]]
name = "jadx-2"
host = "jadx-2"
port = 8650
enabled = true

[[jadx_instances]]
name = "jadx-3"
host = "jadx-3"
port = 8650
enabled = true

# ============================================
# 用户认证配置
# 默认 admin 用户，生产环境请务必修改 token
# ============================================
[[users]]
name = "admin"
token = "admin-secret-token"
is_admin = true

# JADX MCP Server 配置文件
# 此文件预配置连接 3 个 JADX 实例

[server]
host = "0.0.0.0"
port = 8651

[defaults]
request_timeout = 120
busy_timeout = 300
health_check_interval = 30

# ============================================
# JADX 实例配置
# 使用 Docker Compose 内部网络名称
# ============================================

# ============================================
# 用户认证 (可选)
# 取消注释并修改 token 以启用认证
# ============================================

# [[users]]
# name = "alice"
# token = "your-secret-token-here"

[[users]]
name = "admin"
token = "admin-secret-token"
is_admin = true

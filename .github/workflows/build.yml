name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache JADX dependency
        id: cache-jadx
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/io/github/skylot
          key: jadx-1.5.3
          
      - name: Download and Install JADX Dependency
        if: steps.cache-jadx.outputs.cache-hit != 'true'
        run: |
          JADX_VERSION=1.5.3
          echo "Downloading JADX ${JADX_VERSION}..."
          wget -q https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip
          unzip -q jadx-${JADX_VERSION}.zip -d jadx-temp
          mvn install:install-file \
            -Dfile=jadx-temp/lib/jadx-${JADX_VERSION}-all.jar \
            -DgroupId=io.github.skylot \
            -DartifactId=jadx-all \
            -Dversion=${JADX_VERSION} \
            -Dpackaging=jar
          rm -rf jadx-temp jadx-${JADX_VERSION}.zip

      - name: Get project version
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev-${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update version in all files
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          sed -i "s|<version>6.0.0</version>|<version>${VERSION}</version>|" pom.xml
          sed -i "s|VERSION = \".*\"|VERSION = \"${VERSION}\"|" src/main/java/com/zin/jadxaimcp/utils/JadxAIMCPBanner.java
          sed -i "s|SERVER_VERSION = \".*\"|SERVER_VERSION = \"${VERSION}\"|" jadx-mcp-server/src/banner.py

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jadx-ai-mcp-${{ steps.get_version.outputs.version }}
          path: target/jadx-ai-mcp-${{ steps.get_version.outputs.version }}.jar
          retention-days: 30

      - name: Create MCP Server Archive
        run: |
          cd jadx-mcp-server
          zip -r ../jadx-mcp-server-${{ steps.get_version.outputs.version }}.zip \
            jadx_mcp_server.py src/ requirements.txt pyproject.toml README_SERVER.md AUTHENTICATION.md LICENSE

      - name: Upload MCP Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: jadx-mcp-server-${{ steps.get_version.outputs.version }}
          path: jadx-mcp-server-${{ steps.get_version.outputs.version }}.zip
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: tag_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: jadx-ai-mcp-${{ steps.tag_version.outputs.version }}
          path: ./artifacts

      - name: Download MCP Server artifact
        uses: actions/download-artifact@v4
        with:
          name: jadx-mcp-server-${{ steps.tag_version.outputs.version }}
          path: ./artifacts

      - name: Generate Release Notes
        run: |
          cat > release_notes.md << 'EOF'
          ## 📦 Downloads

          | File | Description |
          |------|-------------|
          | `jadx-ai-mcp-${{ steps.tag_version.outputs.version }}.jar` | JADX Plugin |
          | `jadx-mcp-server-${{ steps.tag_version.outputs.version }}.zip` | MCP Server |

          ## 🚀 Quick Install

          ```bash
          jadx plugins --install "github:xjoker:jadx-ai-mcp"
          ```

          ## 🐳 Docker

          ```bash
          docker pull xjoker/jadx-ai-mcp:latest
          docker run -d -p 6080:6080 -p 8650:8650 xjoker/jadx-ai-mcp
          ```

          ## 📖 Documentation

          - [README](https://github.com/xjoker/jadx-ai-mcp/blob/jadx-ai/README.md)
          - [中文文档](https://github.com/xjoker/jadx-ai-mcp/blob/jadx-ai/README_ZH.md)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ steps.tag_version.outputs.version }}
          body_path: release_notes.md
          files: |
            artifacts/jadx-ai-mcp-${{ steps.tag_version.outputs.version }}.jar
            artifacts/jadx-mcp-server-${{ steps.tag_version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and Push Docker Images
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # All-in-One image (JADX GUI + VNC + MCP Server)
      - name: Build and push All-in-One image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PLUGIN_VERSION=${{ steps.version.outputs.version }}
          tags: |
            xjoker/jadx-ai-mcp:${{ steps.version.outputs.version }}
            xjoker/jadx-ai-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Standalone MCP Server image (lightweight)
      - name: Build and push MCP Server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            xjoker/jadx-mcp-server:${{ steps.version.outputs.version }}
            xjoker/jadx-mcp-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


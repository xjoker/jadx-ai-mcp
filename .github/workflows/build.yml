name: Build and Release

on:
  push:
    branches: [main, jadx-ai, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, jadx-ai, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download and Install JADX Dependency
        run: |
          JADX_VERSION=1.5.3
          echo "Downloading JADX ${JADX_VERSION}..."
          wget -q https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip
          unzip -q jadx-${JADX_VERSION}.zip -d jadx-temp
          echo "JADX directory structure:"
          ls -la jadx-temp/lib/
          echo "Installing JADX JAR to local Maven repository..."
          mvn install:install-file \
            -Dfile=jadx-temp/lib/jadx-${JADX_VERSION}-all.jar \
            -DgroupId=io.github.skylot \
            -DartifactId=jadx-all \
            -Dversion=${JADX_VERSION} \
            -Dpackaging=jar
          rm -rf jadx-temp jadx-${JADX_VERSION}.zip
          echo "JADX dependencies installed successfully"

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Get project version
        id: get_version
        run: |
          # Generate date-based version: YYYYMMDD.N
          BASE_VERSION=$(date +%Y%m%d)

          # Check if this is a tagged release
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Extract version from tag (e.g., v20260112.1 -> 20260112.1)
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
            VERSION=$TAG_VERSION
            echo "Using tag version: $VERSION"
          else
            # For non-tagged builds, use date.build_number format
            BUILD_NUM=${{ github.run_number }}
            VERSION="${BASE_VERSION}.${BUILD_NUM}"
            echo "Using generated version: $VERSION"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Final version: $VERSION"

      - name: Rename JAR with version
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          # Find the built JAR and rename it
          ORIGINAL_JAR=$(ls target/jadx-ai-mcp-*.jar | head -1)
          NEW_JAR="target/jadx-ai-mcp-${VERSION}.jar"
          echo "Renaming $ORIGINAL_JAR to $NEW_JAR"
          mv "$ORIGINAL_JAR" "$NEW_JAR"
          ls -la target/*.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jadx-ai-mcp-${{ steps.get_version.outputs.version }}
          path: target/jadx-ai-mcp-${{ steps.get_version.outputs.version }}.jar
          retention-days: 30

      - name: Create MCP Server Archive
        run: |
          cd jadx-mcp-server
          zip -r ../jadx-mcp-server-${{ steps.get_version.outputs.version }}.zip \
            jadx_mcp_server.py \
            src/ \
            requirements.txt \
            pyproject.toml \
            README_SERVER.md \
            AUTHENTICATION.md \
            LICENSE
          cd ..

      - name: Upload MCP Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: jadx-mcp-server-${{ steps.get_version.outputs.version }}
          path: jadx-mcp-server-${{ steps.get_version.outputs.version }}.zip
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: tag_version
        run: |
          # Extract version from tag (v20260112.1 -> 20260112.1)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

          # Extract date and build number for display
          DATE_PART=${VERSION%.*}
          BUILD_PART=${VERSION##*.}
          YEAR=${DATE_PART:0:4}
          MONTH=${DATE_PART:4:2}
          DAY=${DATE_PART:6:2}
          DISPLAY_DATE="${YEAR}-${MONTH}-${DAY}"
          echo "display_date=$DISPLAY_DATE" >> $GITHUB_OUTPUT
          echo "build_num=$BUILD_PART" >> $GITHUB_OUTPUT

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: jadx-ai-mcp-${{ steps.tag_version.outputs.version }}
          path: ./artifacts

      - name: Download MCP Server artifact
        uses: actions/download-artifact@v4
        with:
          name: jadx-mcp-server-${{ steps.tag_version.outputs.version }}
          path: ./artifacts

      - name: Generate Release Notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## JADX AI MCP v${{ steps.tag_version.outputs.version }}

          **Release Date**: ${{ steps.tag_version.outputs.display_date }}
          **Build Number**: #${{ steps.tag_version.outputs.build_num }}

          ---

          ### 📦 Downloads

          Download **BOTH** files to get the complete package:

          1. **jadx-ai-mcp-${{ steps.tag_version.outputs.version }}.jar** - JADX Plugin (Java)
          2. **jadx-mcp-server-${{ steps.tag_version.outputs.version }}.zip** - MCP Server (Python)

          Both components are required for the system to work.

          ---

          ### 🚀 Quick Installation

          #### Method 1: One-Line Install (Recommended)
          ```bash
          jadx plugins --install "github:xjoker:jadx-ai-mcp"
          ```

          #### Method 2: Manual Install
          1. Download the **JAR** file from above
          2. Open JADX GUI → Plugins → Install Plugin → Select the JAR file
          3. Download and unzip the **MCP server** archive
          4. Follow the configuration guide below

          ---

          ### ⚙️ MCP Server Setup

          ```bash
          # 1. Unzip the MCP server
          unzip jadx-mcp-server-${{ steps.tag_version.outputs.version }}.zip
          cd jadx-mcp-server

          # 2. Install UV (if not already installed)
          curl -LsSf https://astral.sh/uv/install.sh | sh

          # 3. Run the server
          uv run jadx_mcp_server.py

          # 4. With authentication (recommended for network exposure)
          uv run jadx_mcp_server.py --auth-token "YOUR_TOKEN"
          ```

          Configure in Claude Desktop (`~/.config/Claude/claude_desktop_config.json`):
          ```json
          {
            "mcpServers": {
              "jadx-mcp-server": {
                "command": "/path/to/uv",
                "args": [
                  "--directory", "/path/to/jadx-mcp-server/",
                  "run", "jadx_mcp_server.py"
                ]
              }
            }
          }
          ```

          ---

          ### ⚡ What's New in v6.0.0

          - 🔐 **Token-based Authentication** - Secure your reverse engineering workflow
          - 🌐 **Remote Access Support** - Connect to JADX on different machines
          - 🐍 **Integrated MCP Server** - Python server now included in repository
          - 📖 **Chinese Documentation** - Complete Chinese README available
          - 🤖 **GitHub Actions** - Automated builds and releases

          ---

          ### 📖 Documentation

          - 📘 [English README](https://github.com/xjoker/jadx-ai-mcp/blob/main/README.md)
          - 📗 [中文文档 (Chinese)](https://github.com/xjoker/jadx-ai-mcp/blob/main/README_ZH.md)
          - 🔐 [Authentication Guide](https://github.com/xjoker/jadx-ai-mcp/blob/main/jadx-mcp-server/AUTHENTICATION.md)
          - 🌐 [Online Documentation](https://jadx-ai-mcp.readthedocs.io/)
          - 💡 [MCP Server README](https://github.com/xjoker/jadx-ai-mcp/blob/main/jadx-mcp-server/README_SERVER.md)

          ---

          ### 🔧 System Requirements

          | Component | Requirement |
          |-----------|-------------|
          | JADX | 1.5.1+ (r2333+) |
          | Java | 11 or higher |
          | Python | 3.10+ (for MCP server) |
          | UV | Latest version (recommended) |

          ---

          ### 🐛 Need Help?

          - **Report Issues**: https://github.com/xjoker/jadx-ai-mcp/issues
          - **Discussions**: https://github.com/xjoker/jadx-ai-mcp/discussions
          - **Documentation**: https://jadx-ai-mcp.readthedocs.io/

          ---

          Built with ❤️ by the JADX AI MCP community
          EOF

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.tag_version.outputs.version }}
          body_path: release_notes.md
          files: |
            artifacts/jadx-ai-mcp-${{ steps.tag_version.outputs.version }}.jar
            artifacts/jadx-mcp-server-${{ steps.tag_version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download and Install JADX Dependency
        run: |
          JADX_VERSION=1.5.3
          echo "Downloading JADX ${JADX_VERSION}..."
          wget -q https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip
          unzip -q jadx-${JADX_VERSION}.zip -d jadx-temp
          echo "JADX directory structure:"
          ls -la jadx-temp/lib/
          echo "Installing JADX JAR to local Maven repository..."
          mvn install:install-file \
            -Dfile=jadx-temp/lib/jadx-${JADX_VERSION}-all.jar \
            -DgroupId=io.github.skylot \
            -DartifactId=jadx-all \
            -Dversion=${JADX_VERSION} \
            -Dpackaging=jar
          rm -rf jadx-temp jadx-${JADX_VERSION}.zip
          echo "JADX dependencies installed successfully"

      - name: Compile and Test
        run: |
          mvn clean compile
          mvn test || echo "Tests not configured yet"

      - name: Verify Python MCP Server
        run: |
          cd jadx-mcp-server
          python3 --version
          pip3 install --quiet httpx fastmcp || true
          python3 -m py_compile jadx_mcp_server.py
          echo "Python MCP server syntax check passed"

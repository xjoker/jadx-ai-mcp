name: Python Tests

on:
  push:
    branches:
      - dev
    paths:
      - "jadx-mcp-server/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "jadx-mcp-server/**"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

env:
  # Test Node.js 24 compatibility ahead of June 2, 2026 deadline
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jadx-mcp-server

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest --ignore=tests/integration -q

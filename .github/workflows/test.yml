name: Test

on:
  push:
    branches: [jadx-ai, main]
    paths:
      - 'jadx-mcp-server/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [jadx-ai, main]
    paths:
      - 'jadx-mcp-server/**'
  workflow_dispatch:
    inputs:
      test_layer:
        description: 'Select test layer to run'
        required: true
        type: choice
        options:
          - 'layer1-2'
          - 'layer3'
          - 'all'
        default: 'layer1-2'

jobs:
  test:
    name: Python Tests (Layer 1+2)
    runs-on: ubuntu-latest
    # Run on push/PR, or when manually triggered with layer1-2 or all
    if: |
      github.event_name == 'push' || 
      github.event_name == 'pull_request' || 
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.test_layer == 'layer1-2' || github.event.inputs.test_layer == 'all'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: jadx-mcp-server/requirements.txt
      
      - name: Install dependencies
        run: |
          cd jadx-mcp-server
          pip install -r requirements.txt
          pip install pytest pytest-asyncio respx
      
      - name: Run unit tests
        run: |
          cd jadx-mcp-server
          python -m pytest tests/ -v --tb=short --junit-xml=test-results.xml 2>&1 | tee test-output.txt
      
      - name: Test summary
        if: always()
        run: |
          cd jadx-mcp-server
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Extract test statistics
          if [ -f test-output.txt ]; then
            # Get summary line (e.g., "57 passed, 1 error in 0.34s")
            SUMMARY=$(grep -E "^(=+.*=+|passed|failed|error)" test-output.txt | tail -1)
            echo "**Status:** $SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Show passed tests
            echo "### ✅ Passed Tests" >> $GITHUB_STEP_SUMMARY
            grep "PASSED" test-output.txt | sed 's/PASSED//' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY || echo "_No passed tests found_" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Show failed tests if any
            if grep -q "FAILED" test-output.txt; then
              echo "### ❌ Failed Tests" >> $GITHUB_STEP_SUMMARY
              grep "FAILED" test-output.txt | sed 's/FAILED//' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
            
            # Show errors if any
            if grep -q "ERROR" test-output.txt; then
              echo "### ⚠️ Errors" >> $GITHUB_STEP_SUMMARY
              grep "ERROR" test-output.txt | sed 's/ERROR//' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Test output file not found" >> $GITHUB_STEP_SUMMARY
          fi

  # Optional: Integration tests with JADX container
  # Disabled by default to save CI costs
  # Manually trigger via workflow_dispatch
  integration:
    name: Integration Tests (Layer 3)
    runs-on: ubuntu-latest
    # Only run when manually triggered with layer3 or all
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.test_layer == 'layer3' || github.event.inputs.test_layer == 'all')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Start JADX container
        run: |
          echo "🚀 Starting JADX-AI-MCP container..."
          docker run -d --name jadx \
            -p 8650:8650 \
            -p 8651:8651 \
            xjoker/jadx-ai-mcp:latest
          
          echo "Container started, waiting for services..."
      
      - name: Wait for JADX to be ready
        run: |
          echo "⏳ Waiting for MCP Server to start..."
          MAX_ATTEMPTS=60
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            
            # Check if MCP server is responding (root path returns FastMCP info)
            # Note: JADX Plugin API (8650) requires APK to be loaded, so we only check MCP Server
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8651/ 2>/dev/null || echo "000")
            
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
              echo "✅ MCP Server is responding (HTTP $HTTP_CODE)"
              
              # Additional check: see if the /mcp endpoint exists
              MCP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8651/mcp 2>/dev/null || echo "000")
              echo "  MCP endpoint status: HTTP $MCP_CODE"
              echo "🎉 Container is ready for testing!"
              exit 0
            fi
            
            echo "  Attempt $ATTEMPT/$MAX_ATTEMPTS: waiting... (HTTP $HTTP_CODE)"
            sleep 3
          done
          
          echo "❌ MCP Server failed to start in time"
          echo "📋 Container logs:"
          docker logs jadx 2>&1 | tail -100
          exit 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd jadx-mcp-server
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx respx
      
      - name: Run integration tests
        run: |
          cd jadx-mcp-server
          python -m pytest tests/integration/ -v --tb=short || echo "No integration tests found"
      
      - name: Show container logs on failure
        if: failure()
        run: |
          echo "📋 JADX Container Logs:"
          docker logs jadx
      
      - name: Cleanup
        if: always()
        run: |
          docker stop jadx || true
          docker rm jadx || true

[project]
name = "jadx-mcp-server"
version = "0.1.0"
description = "MCP Server for JADX AI - Connect LLMs with JADX decompiler"
readme = "README_SERVER.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.28.1",
    "tomli>=2.0.0; python_version < '3.11'",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["jadx_mcp_server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
jadx_mcp_server = "jadx_mcp_server:main"

[project]
name = "jadx-mcp-server"
version = "6.4.0"
description = "MCP Server for JADX AI - Connect LLMs with JADX decompiler"
readme = "README_SERVER.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp==3.1.0",
    "httpx==0.28.1",
    "tomli==2.4.0; python_version < '3.11'",
]

[project.optional-dependencies]
compression = [
    "brotli==1.1.0",
]
dev = [
    "pytest>=7,<9",
    "pytest-asyncio>=0.21,<1",
    "respx==0.23.1",
]

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["jadx_mcp_server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
jadx_mcp_server = "jadx_mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/integration"
markers = [
    "integration: Integration tests that require a running JADX service",
]
